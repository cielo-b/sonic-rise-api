# Local development services. Start with: docker compose -f docker/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: sonicrise-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sonicrise
      POSTGRES_PASSWORD: sonicrise
      POSTGRES_DB: sonicrise
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonicrise"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sonicrise-minio
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web Console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sonicrise}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-minio}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: sonicrise-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Inbox UI → http://localhost:8025
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
