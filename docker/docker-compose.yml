version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: sonicrise-minio
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web Console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: sonicrise
      MINIO_ROOT_PASSWORD: "sonicrise2024!"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
    driver: local
